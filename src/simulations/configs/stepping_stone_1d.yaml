kind: stepping_stone_1d
name: default
random_seed: 42
n_workers: 8
fixed:
  K: 25
  n_per_deme: 64
  L: 20000
  Ne: 4000
sweep:
  type: stepping_stone
  # Swept parameter is 1/M (M = 4*Ne*m), log-spaced
  num_inv_M: 100
  inv_M_min: 0.0005
  inv_M_max: 0.05
cluster:
  job_name: SS_1D
  # From the previous 100-task run (job 53752342, all COMPLETED): worst case 52m34s and
  # 1.05G MaxRSS at 8 cpus. Pinned rather than re-probed. The new grid reaches lower m
  # than that run did, so the structured phase before pooling is longer -- hence 2h, and
  # 2G since 1G left no headroom over the observed peak.
  mem: 2G
  time: "02:00:00"
  cpus_per_task: 8
