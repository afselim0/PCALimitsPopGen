kind: stepping_stone_2d
name: default
random_seed: 42
n_workers: 8
fixed:
  K: 9                # 9x9 grid, 81 demes
  n_per_deme: 64
  L: 20000
  Ne: 1000
sweep:
  type: stepping_stone
  # Swept parameter is 1/M (M = 4*Ne*m), log-spaced. At Ne=1000 this is
  # M in [2, 200], i.e. m in [0.0005, 0.05].
  num_inv_M: 100
  inv_M_min: 0.005
  inv_M_max: 0.5
cluster:
  job_name: SS_2D
  # From the previous 100-task run (job 53752344, all COMPLETED): worst case 4h54m and
  # 1.14G MaxRSS at 8 cpus -- the old mem: 1G was under the observed peak, hence 2G here.
  # Time kept generous: the new grid reaches lower m, so the structured phase is longer.
  mem: 2G
  time: "10:22:07"
  cpus_per_task: 8
