kind: stepping_stone_2d
name: default
random_seed: 42
n_workers: 8
fixed:
  K: 9                # 9x9 grid, 81 demes
  n_per_deme: 64
  L: 20000
  Ne: 1000
sweep:
  type: stepping_stone
  num_m: 100
  min: 0.001
  max: 0.1
  spacing: log_dense_high   # finer resolution near m_max, where m_c is expected to sit
cluster:
  job_name: SS_2D
  mem: 1G           # from --estimate probe on 2026-08-20 (K=9): worst-case high-m row is
  time: "10:22:07"  # slow enough (574s/100 SNPs) that re-probing on every submit is wasteful
  cpus_per_task: 8
