# Two-population split: PC1 overlap vs Fst, varying total N at balanced sampling.
# Matches src/analysis/SingleSplitSweeps.py's vary_N sweep (N = 100..1000, phi = 0.5,
# L = 2e4), so the two pipelines can be compared row for row.
model: split
name: split_vary_N
simdir: results/simulations/split

n_replicates: 8
seed: 0

fixed:
  L: 20000
  L_polymorphic: false   # as the existing driver: L is a pre-filter draw count here

sampling:
  fixed: {phi: 0.5}
  vary:
    param: N
    values: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]

cluster:
  job_name: sw_split_N
  time: "01:00:00"
  mem: 3G
  cpus_per_task: 1
