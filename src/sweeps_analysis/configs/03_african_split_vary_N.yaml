# OOA3 sister pair: PC3 alignment vs Fst, varying total N at fixed sister fraction.
#
# The expensive config: prepare() runs pop_coal_times, an msprime numerical integration
# per population pair, ~15-20 min for this task's t_split. That is paid once per array
# task, which is what the array-over-simulations layout buys.
model: african_split
name: african_split_vary_N
simdir: results/simulations/african_split

n_replicates: 8
seed: 0

fixed:
  L: 20000
  # Exact width, so gamma is fixed across the sweep. Feasible with large margin: the
  # smallest cell (N=100) still leaves 37k polymorphic columns.
  L_polymorphic: true

sampling:
  fixed: {phi_sister: 0.20}
  vary:
    param: N
    values: [100, 200, 400, 800, 1600]

cluster:
  job_name: sweep_ooa3_N
  # The 15-20 min coalescent integration is no longer paid here -- precompute_coal_times.py
  # computes it once per t_split as a stage-0 array and prepare() reads the cache. What is
  # left is 8 replicates x 5 cells of subsample+eigh, measured at 0.8 s + 1.1 s for the
  # largest (N=1600) cell: under a minute per task.
  time: "00:30:00"
  mem: 4G            # measured peak 2.0 G on the N=1600 cell
  cpus_per_task: 1
