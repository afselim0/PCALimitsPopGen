# Recent spatial structure (panmictic A + a K x K grid B): spatial-axis recovery vs 1/M,
# varying n-per-deme-B at a fixed 50/50 split between the structured and panmictic halves.
model: split_stepping_stone
name: split_ss_vary_N
simdir: results/simulations/split_stepping_stone/K9

n_replicates: 8
seed: 0

fixed:
  L: 10000
  # Exact width. Feasible: the smallest cell (n_per_deme_B = 2, N = 324) leaves 10521
  # polymorphic columns against the 10000 requested -- a 5% margin, the second tightest
  # in the set after config 06.
  L_polymorphic: true

# cos^2 is NOT monotone in 1/M on this demography: it peaks near 1/M ~ 0.3 and then decays,
# because at very weak migration the demes drift into independent clusters and the single
# (1,0)/(0,1) spatial pair stops describing the structure. That turnover is a real feature
# worth showing, so the summariser fits a local-linear curve and reports the peak (height
# and location) instead of forcing a sigmoid and a 0.9 crossing.
non_monotone: true

sampling:
  fixed: {phi: 0.5}
  vary:
    param: n_per_deme_B
    values: [2, 4, 8, 16, 32]

cluster:
  job_name: sweep_split_ss_N
  # The 05:00:00 / 8G block was sized for the old [10,20,30,40,50,60] grid, whose largest
  # cell was N=9720. The new [2,4,8,16,32] grid tops out at N=5184, cutting the summed
  # N^3 work by 12x. Measured at that largest cell: subsample 0.8 s, eigh 26.9 s, peak
  # RSS 2.0 G. Two eigendecompositions per replicate (the standardized GRM alongside the
  # ordinary one) plus within_B_F_hat's phase-type solve per cell keep the margin wide.
  time: "01:00:00"
  mem: 5G
  cpus_per_task: 1
