# Recent spatial structure (panmictic A + a K x K grid B): spatial-axis recovery vs 1/M,
# varying n-per-deme-B at a fixed 50/50 split between the structured and panmictic halves.
# Matches src/analysis/RecentSpatialOverlapVsM.py's vary_n sweep.
model: split_stepping_stone
name: split_ss_vary_N
simdir: results/simulations/split_stepping_stone/K9

n_replicates: 8
seed: 0

fixed:
  L: 10000
  L_polymorphic: false

# cos^2 is NOT monotone in 1/M on this demography: it peaks near 1/M ~ 0.3 and then decays,
# because at very weak migration the demes drift into independent clusters and the single
# (1,0)/(0,1) spatial pair stops describing the structure. That turnover is a real feature
# worth showing, so the summariser fits a local-linear curve and reports the peak (height
# and location) instead of forcing a sigmoid and a 0.9 crossing.
non_monotone: true

sampling:
  # n-per-deme-B on a linear grid. The old [2,4,8,16,32,64] lost its top level: at
  # phi = 0.5, n_A = n_per_deme_B * K^2, so n=64 needs 5184 samples from A but only 5000
  # were simulated, and the model skipped it. Every value here stays under that cap
  # (n=60 needs 4860), so all six levels are measured.
  fixed: {phi: 0.5}
  vary:
    param: n_per_deme_B
    values: [10, 20, 30, 40, 50, 60]

cluster:
  job_name: sw_splitss_N
  # Measured on a real task (sim99, all six cells): 51 min wall, 4.44G peak RSS.
  # Both numbers are worth pinning rather than deriving -- an arrays-only estimate
  # (subsample + GRM = 1.15G at n=60) understated the true peak by ~4x, because eigh
  # workspace, LAPACK scratch and float64 copies dominate at these N. The n=60 cell
  # alone is ~49% of the N^3 work, so the tail is where both time and memory land.
  time: "02:00:00"   # 51 min measured, 2.4x margin for a loaded node
  mem: 8G            # 4.44G measured, 1.8x margin
  cpus_per_task: 1
