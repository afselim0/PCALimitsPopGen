# 1D stepping stone, uniform dilution: every p-th deme sampled, total N held fixed.
#
# The counterpart of config 06. There the deme subset is random and redrawn per replicate;
# here it is every p-th deme, which is fixed by (K, p), so the theoretical axis is a
# property of the cell and the ordinary fixed-V_theory path applies -- no cell_replicates.
#
# N_total is spread over however many demes survive the stride, so n-per-deme is derived,
# not configured: p = [1,2,3,4,5] at K=25 keeps [25,13,9,7,5] demes, giving n-per-deme
# [4,7,11,14,20] and realised N [100,91,99,98,100]. Holding N fixed is what isolates
# spatial coverage from sample size.
model: stepping_stone
name: ss1d_vary_deme_stride
simdir: results/simulations/stepping_stone_1d/K25

n_replicates: 8
seed: 0

fixed:
  dimension: 1
  K: 25                  # designs() needs the lattice size before any simulation row is read
  L: 10000
  L_polymorphic: true    # exact width; >12600 polymorphic at every stride level

sampling:
  fixed: {N_total: 100}
  vary:
    param: deme_stride
    values: [1, 2, 3, 4, 5]

cluster:
  job_name: sw_ss1d_stride
  time: "00:45:00"   # N ~ 100 throughout; the cheapest sweep in the set
  mem: 3G
  cpus_per_task: 1
