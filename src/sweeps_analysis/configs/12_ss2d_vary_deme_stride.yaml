# 2D stepping stone, uniform dilution: every p-th row AND column sampled, total N fixed.
#
# The counterpart of config 08, on the same fixed-subset logic as config 11.
#
# p = [1,2,3,4] at K=9 keeps sides [9,5,3,3], i.e. [81,25,9,9] demes, giving n-per-deme
# [4,12,36,36] and realised N [324,300,324,324]. p=3 and p=4 retain the same NUMBER of
# demes ({0,3,6} against {0,4,8}) but not the same geometry, and only p=4 is symmetric
# about the lattice centre; p=3 therefore breaks the (1,0)/(0,1) degeneracy (nu ~ 49
# against 43 at M=1) while p=4 preserves it. That contrast is the point of keeping both.
model: stepping_stone
name: ss2d_vary_deme_stride
simdir: results/simulations/stepping_stone_2d/K9

n_replicates: 8
seed: 0

fixed:
  dimension: 2
  K: 9
  L: 10000
  L_polymorphic: true    # exact width; >13600 polymorphic at every stride level

sampling:
  fixed: {N_total: 324}
  vary:
    param: deme_stride
    values: [1, 2, 3, 4]

cluster:
  job_name: sw_ss2d_stride
  time: "00:45:00"   # N ~ 324 throughout
  mem: 3G
  cpus_per_task: 1
